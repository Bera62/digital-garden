# Inspiratie voor de digital garden
### Cinematic Storytelling & Videografie
**Bera Pinar - klas 204**

---

# Agenda

1. **Onderwerp:** Wat, waarom en hoe
2. **Patronen & Analyse:** Systematisch kijken naar 50 beelden
3. **Beeldarchief (50 beelden):**
   - Thema 1: Licht & Schaduw (01–10)
   - Thema 2: Beweging & Dynamiek (11–20)
   - Thema 3: Kleur & Sfeer (21–30)
   - Thema 4: Framing & Diepte (31–40)
   - Thema 5: Textuur & Materiaal (41–50)
4. **10 Bronnen & Inspiratielinks:** Verdieping
5. **Contentstrategie & Introtekst:** Eigen versus overige content

---

# Onderwerp: Wat, Waarom en Hoe?

* **Wat is de passie?**
  * Verhalen vertellen met beeld: hoe camera, licht, geluid en montage samen sfeer bepalen.
* **Waarom dit onderwerp?**
  * Beeldtaal triggert directe emotie en herkenning wat tekst vaak minder goed doet.
  * Het maakt van gewone, dagelijkse momenten iets filmisch en interessants om naar te kijken.
* **Hoe pas ik dit toe?**
  * Beheersing van cameratechniek (focal length, sluitertijd, framerate, natuurlijk licht).
  * Postproductie en montage: pacing, speed ramping, color grading en sound design.

---

# 50 Beelden: Patronen & Visuele Analyse

Bij het verzamelen van 50 beeldfragmenten vielen duidelijke patronen op:

* **Licht & Contrast (Chiaroscuro):** Veel shots benutten één dominante lichtbron met diepe schaduwzones.
* **Kleurharmonie:** Dominantie van complementaire contrasten (warme highlights tegenover koele blauwtinten).
* **Standpunt & Perspectief:** Laag kikkerperspectief en leidende lijnen die richting geven aan het kader.
* **Textuur & Tastbaarheid:** Scherpe details van materialen (metaal, glas, interfaces) die authenticiteit toevoegen.

# 10 Inspiratielinks (1/2)

* [No Film School](https://nofilmschool.com) <span class="badge">Belichting</span>
  * *Inzicht:* Hoe je met minimale lichtbronnen (chiaroscuro) maximale visuele diepte creëert.
* [StudioBinder Pacing Guide](https://www.studiobinder.com/blog/video-editing-pacing/) <span class="badge">Montageritme</span>
  * *Inzicht:* Timing van cuts en hoe ritme de emotie van de kijker bepaalt.
* [ShotDeck Archive](https://shotdeck.com) <span class="badge">Beeldanalyse</span>
  * *Inzicht:* Beeldbank voor framing, kleurenpaletten en kaders van bioscoopfilms.
* [Premiere Gal Tutorials](https://premieregal.com) <span class="badge">Workflow</span>
  * *Inzicht:* Efficiënte timeline organisatie, nesting en dynamische speed ramps.
* [CineD Gear Reviews](https://www.cined.com) <span class="badge">Hardware</span>
  * *Inzicht:* Praktische analyses van sensor dynamic range en ISO prestaties.

---

# 10 Inspiratielinks (2/2)

* [IndieWire Craft Series](https://www.indiewire.com/c/craft/) <span class="badge">Narratief</span>
  * *Inzicht:* Interviews met filmmakers over de vertaling van emotie naar camerabeweging.
* [Fstoppers Lighting Techniques](https://fstoppers.com) <span class="badge">Techniek</span>
  * *Inzicht:* Contrastratio's beheersen tussen key, fill en rim lighting.
* [Aputure Light Academy](https://www.aputure.com) <span class="badge">Kleurkwaliteit</span>
  * *Inzicht:* Verschil tussen diffuse softboxen vs hard licht en kleurtemperatuur.
* [Artgrid Storytelling Hub](https://artgrid.io) <span class="badge">Compositie</span>
  * *Inzicht:*  trends in vloeiende cameravoering en framing.
* [B&H Explora Optics](https://www.bhphotovideo.com/explora/) <span class="badge">Optica</span>
  * *Inzicht:* Het verschil van telelenzen en groothoeken.

---

# Vertellen met Content in de Digital Garden

Hoe bouw ik dit uit met een mix van eigen en externe content?

* **Eigen content:**
  * Korte videoclips en ruwe B-roll opnames als demonstratie.
  * Screenshots van eigen montagetimelines (cuts, lagen en kleurgrading-nodes).
  * Veldnotities over camera-instellingen en belichtingsopstellingen.
* **Overige content (Curatie):**
  * Vergelijkende beeldstills van filmscènes.
  * Directe verwijzingen naar artikelen over montagetheorie en optica.
  * Geannoteerde cheatsheets voor sluitertijden en beeldhoeken.

---

# Introtekst voor de Digital Garden

Wat wil ik de bezoeker vertellen over dit onderwerp?
* Dat de kracht van beeld niet ontstaat door dure apparatuur, maar door keuzes in licht, timing en framing.

### Eerste stukje content als basis voor de garden:
> Cinematic storytelling: hoe beeld, licht en ritme samenkomen om van alledaagse momenten een verhaal te maken dat je direct voelt
